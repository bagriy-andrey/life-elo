<!-- @template name="Главная" description="Рейтинг, чарт динамики по дням с дельтами, мин/макс, лучший/худший день, серия и разбор выбранного дня" -->
<div style="min-height:100dvh;background:var(--bg);color:var(--text);font:var(--text-md)/var(--line-height) var(--font-sans)">
<main style="max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px 96px;display:flex;flex-direction:column;gap:12px">
<header style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:4px 4px 8px">
<div style="display:flex;flex-direction:column;gap:0">
<span style="color:var(--muted);font-size:var(--text-sm)">Life Elo</span>
<sc-if value="{{ ratingPos }}"><strong style="font-size:3rem;line-height:1;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;color:var(--pos)">{{ ratingLabel }}</strong></sc-if><sc-if value="{{ ratingNeg }}"><strong style="font-size:3rem;line-height:1;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;color:var(--neg)">{{ ratingLabel }}</strong></sc-if>
</div>
<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;padding-bottom:4px">
<x-import component-from-global-scope="LifeElo.Pill" tone="{{ yTone }}">{{ yDelta }}</x-import>
<span style="color:var(--muted);font-size:var(--text-xs)">{{ yLabel }}</span>
</div>
</header>
<section style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 0 16px;display:flex;flex-direction:column;gap:12px;overflow:hidden">
<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 16px">
<div style="display:flex;flex-direction:column;gap:2px;min-width:0">
<h2 style="margin:0;font-size:var(--text-lg)">Динамика</h2>
<span style="font-size:var(--text-sm);color:var(--muted)"><sc-if value="{{ periodPos }}"><span style="font-weight:700;font-variant-numeric:tabular-nums;color:var(--pos)">{{ periodChange }}</span></sc-if><sc-if value="{{ periodNeg }}"><span style="font-weight:700;font-variant-numeric:tabular-nums;color:var(--neg)">{{ periodChange }}</span></sc-if> {{ periodLabel }}</span>
</div>
<!-- Period toggle: pill tablist; selected tab = card bg, text color, weight 600, shadow 0 1px 3px rgba(0,0,0,.12); other = transparent, muted -->
<div role="tablist" aria-label="Период" style="display:flex;gap:2px;padding:3px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-full);flex:none">
<button type="button" role="tab" aria-selected="true" onClick="{{ setTen }}" style="min-height:36px;padding:0 14px;border:0;border-radius:var(--radius-full);font:inherit;font-size:var(--text-sm);cursor:pointer;background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)">10 дней</button>
<button type="button" role="tab" aria-selected="false" onClick="{{ setAll }}" style="min-height:36px;padding:0 14px;border:0;border-radius:var(--radius-full);font:inherit;font-size:var(--text-sm);cursor:pointer;background:transparent;color:var(--muted);font-weight:400">Всё время</button>
</div>
</div>
<div ref="{{ scrollRef }}" style="overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain">
<div style="position:relative;width:{{ innerW }}px;min-width:100%">
<svg width="{{ innerW }}" height="190" aria-hidden="true" style="position:absolute;left:0;top:0;pointer-events:none;overflow:visible">
<defs><linearGradient id="homeAreaFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:0.3"></stop><stop offset="1" style="stop-color:var(--accent);stop-opacity:0.02"></stop></linearGradient></defs>
<sc-for list="{{ grid }}" as="g"><line x1="0" x2="{{ innerW }}" y1="{{ g.y }}" y2="{{ g.y }}" style="stroke:var(--border);stroke-width:1;stroke-dasharray:4 4"></line></sc-for>
<path d="{{ areaPath }}" style="fill:url(#homeAreaFill)"></path>
<sc-if value="{{ showZero }}"><line x1="0" x2="{{ innerW }}" y1="{{ zeroY }}" y2="{{ zeroY }}" style="stroke:var(--muted);stroke-width:1;opacity:0.55"></line></sc-if>
<path d="{{ linePath }}" style="fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"></path>
</svg>
<sc-if value="{{ showZero }}"><span style="position:absolute;left:6px;top:{{ zeroLabelY }}px;font-size:10px;line-height:1;color:var(--muted);background:var(--card);padding:1px 3px;border-radius:4px;pointer-events:none">0</span></sc-if>
<div style="position:relative;display:flex">
<sc-for list="{{ cols }}" as="c">
<button type="button" onClick="{{ c.select }}" aria-pressed="{{ c.selected }}" aria-label="{{ c.aria }}" style="flex:none;width:{{ c.w }}px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent">
<span style="position:relative;display:block;width:100%;height:190px">
<sc-if value="{{ c.selected }}">
<span style="position:absolute;left:50%;top:{{ c.dotY }}px;bottom:0;width:0;border-left:1px dashed var(--muted);opacity:0.5"></span>
<span style="position:absolute;left:{{ c.tipLeft }};top:{{ c.tipY }}px;transform:translateX({{ c.tipShift }});display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 10px;border-radius:10px;background:var(--text);color:var(--card);white-space:nowrap;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.18)">
<strong style="font-size:var(--text-sm);line-height:1.2;font-variant-numeric:tabular-nums">{{ c.ratingLabel }}</strong>
<span style="font-size:10px;line-height:1.2;opacity:0.75">{{ c.shortDate }}</span>
</span>
</sc-if>
<!-- Dot: idle 10px pos/neg fill + 2px card border; selected 14px + box-shadow 0 0 0 4px color-mix(in srgb, <tone> 28%, transparent) -->
<span style="position:absolute;left:50%;top:{{ c.dotY }}px;width:10px;height:10px;transform:translate(-50%,-50%);border-radius:50%;background:var(--pos);border:2px solid var(--card)"></span>
</span>
<!-- Delta chip: idle bg color-mix(in srgb, <tone> 15%, var(--card)) + tone text; selected bg tone + card text -->
<span style="min-width:0;width:calc(100% - 4px);height:24px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-full);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;background:color-mix(in srgb, var(--pos) 15%, var(--card));color:var(--pos)">{{ c.chip }}</span>
<!-- Day label: selected = text color, weight 700; idle = muted, 400 -->
<span style="font-size:10px;line-height:1;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums;height:12px">{{ c.dayLabel }}</span>
</button>
</sc-for>
</div>
</div>
</div>
<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:0 16px">
<sc-for list="{{ tiles }}" as="t">
<button type="button" onClick="{{ t.select }}" style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:64px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font:inherit;text-align:left;cursor:pointer">
<span style="font-size:var(--text-xs);color:var(--muted)">{{ t.label }}</span>
<span style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%">
<strong style="font-size:1.15rem;font-variant-numeric:tabular-nums;color:var(--text)">{{ t.value }}</strong>
<span style="font-size:var(--text-xs);color:var(--muted);white-space:nowrap">{{ t.sub }}</span>
</span>
</button>
</sc-for>
<button type="button" onClick="{{ streak.select }}" style="grid-column:1 / -1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:64px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font:inherit;text-align:left;cursor:pointer">
<span style="font-size:var(--text-xs);color:var(--muted)">Серия плюсовых дней</span>
<span style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%">
<strong style="font-size:1.15rem;color:var(--pos)">{{ streak.value }}</strong>
<span style="font-size:var(--text-xs);color:var(--muted);white-space:nowrap">{{ streak.sub }}</span>
</span>
</button>
</div>
</section>
<h2 style="margin:12px 4px 0;font-size:var(--text-lg)">Разбор дня</h2>
<div ref="{{ detailRef }}">
<!-- The mockup forces the <details> open via DOM after mount -->
<x-import component-from-global-scope="LifeElo.HistoryEntry" entry="{{ selEntry }}" habits="{{ habits }}"></x-import>
</div>
</main>
<x-import component-from-global-scope="LifeElo.TabBar" items="{{ tabs }}" active="home"></x-import>
</div>

<script>
// Behavior-defining parts of the mockup script (sample data generator omitted).
// DATA[i] = { date, delta, rating (=ratingAfter), entry: LedgerEntry }, oldest → newest. Initial sel = last day, range 'ten'.
const signed = (n, d = 1) => /* +x.d / −x.d / '0' with U+2212 */ 0;
const signedInt = n => /* Math.round, signed */ 0;
const longDate = d => d.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long' });
const shortDate = d => d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }).replace('.', '');

function smooth(pts) {
  if (!pts.length) return '';
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], mx = (x1 - x0) / 2;
    d += ` C${x0 + mx},${y0} ${x1 - mx},${y1} ${x1},${y1}`;
  }
  return d;
}

// Width w = scroll container clientWidth (ResizeObserver). On range/width change: scrollLeft = scrollWidth (newest on the right).
// Tile tap → pick(i, center=true): scrollTo({ left: i*step - (clientWidth-step)/2, behavior: 'smooth' }).
// pick(i): if i is older than the last 10 days, range switches to 'all'. setTen: if selection is outside last 10 → select last day.
// Selection change → «Разбор дня» shows DATA[sel].entry, expanded.

function renderVals({ range, sel, w }) {
  const off = range === 'ten' ? DATA.length - 10 : 0;
  const view = DATA.slice(off);
  const step = Math.max(28, w / 10), H = 190, padT = 54, padB = 14;
  const innerW = Math.round(step * view.length);
  const vals = view.map(d => d.rating);
  let lo = Math.min(...vals, 0), hi = Math.max(...vals, 0);          // alwaysShowZero (default true)
  const pad = (hi - lo) * 0.06 || 1; lo -= pad; hi += pad;
  const Y = v => padT + (hi - v) / (hi - lo) * (H - padT - padB);
  const pts = view.map((d, i) => [step * i + step / 2, Math.round(Y(d.rating) * 10) / 10]);
  const line = smooth(pts);
  const zeroY = Y(0);
  const area = `${line} L${pts.at(-1)[0]},${zeroY} L${pts[0][0]},${zeroY} Z`;
  const grid = [0.25, 0.5, 0.75].map(f => ({ y: padT + f * (H - padT - padB) }));

  const cols = view.map((d, k) => {
    const i = off + k, s = i === sel;
    const prevMonth = k > 0 && view[k - 1].date.getMonth() !== d.date.getMonth();
    const edge = k === 0 ? 'first' : k === view.length - 1 ? 'last' : '';
    return {
      w: step, selected: s,
      aria: `${longDate(d.date)}: ${signed(d.delta, 2)}, рейтинг ${signed(d.rating)}`,
      dotY: pts[k][1],
      tone: d.delta >= 0 ? 'pos' : 'neg',
      chip: signedInt(d.delta),
      dayLabel: d.date.getDate() === 1 || prevMonth ? shortDate(d.date) : String(d.date.getDate()),
      ratingLabel: signed(d.rating), shortDate: shortDate(d.date),
      tipY: Math.max(2, pts[k][1] - 50),
      tipLeft: edge === 'first' ? '2px' : edge === 'last' ? 'calc(100% - 2px)' : '50%',
      tipShift: edge === 'first' ? '0' : edge === 'last' ? '-100%' : '-50%',
    };
  });

  // Tiles are computed over the shown range (view); ties keep the earliest day.
  const iMin = /* lowest rating */ 0, iMax = /* highest rating */ 0;
  const iBest = /* largest delta */ 0, iWorst = /* smallest delta */ 0;
  let cur = 0; for (let i = DATA.length - 1; i >= 0 && DATA[i].delta > 0; i--) cur++;   // current streak: whole history
  let rec = 0, recEnd = off, run = 0;                                                  // record: inside the view
  view.forEach((d, k) => { run = d.delta > 0 ? run + 1 : 0; if (run > rec) { rec = run; recEnd = off + k; } });
  const tiles = [
    { label: '↓ Минимум', value: signed(DATA[iMin].rating), color: 'text', sub: shortDate(DATA[iMin].date) },
    { label: '↑ Максимум', value: signed(DATA[iMax].rating), color: 'text', sub: shortDate(DATA[iMax].date) },
    { label: 'Лучший день', value: signed(DATA[iBest].delta, 2), color: 'pos', sub: shortDate(DATA[iBest].date) },
    { label: 'Худший день', value: signed(DATA[iWorst].delta, 2), color: 'neg', sub: shortDate(DATA[iWorst].date) },
  ];
  const streak = { value: cur ? `сейчас ${cur} дней` : 'сейчас нет', pos: cur > 0, sub: `рекорд ${rec} дней`, select: recEnd };

  const last = DATA.at(-1);
  const startRating = range === 'ten' ? DATA[off].entry.ratingBefore : 0;
  return {
    ratingLabel: signed(last.rating), yDelta: signed(last.delta, 2), yTone: last.delta >= 0 ? 'pos' : 'neg',
    yLabel: `за ${longDate(last.date)}`,
    periodChange: signed(last.rating - startRating), periodLabel: range === 'ten' ? 'за 10 дней' : 'за всё время',
  };
}
</script>
